name: Validate Plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-plugin.mjs

  python:
    name: Python scripts (compile + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile scripts
        run: python -m compileall -q skills
      - name: Lint scripts (ruff, error-level)
        run: |
          python -m pip install --upgrade pip ruff
          ruff check --select E9,F63,F7,F82 skills
